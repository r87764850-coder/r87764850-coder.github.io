<body><!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jadwal Operasional</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            color: #111;

            /* BACKGROUND BARU */
            background-color: #f3e6d0;
            background-image:
                radial-gradient(#d6b98c 1px, transparent 1px);
            background-size: 25px 25px;
        }

        .container {
            width: 92%;
            max-width: 720px;
            margin: auto;
            padding: 25px 0;
        }

        .logo {
            text-align: center;
            height: 285px;
            padding-top: 25px;
        }

        .java-logo {
            position: relative;
            display: inline-block;
            width: 240px;
            height: 240px;
        }

        .cup {
            position: absolute;
            width: 125px;
            height: 75px;
            border: 12px solid #0879bd;
            border-top: 0;
            border-radius: 0 0 65px 65px;
            left: 55px;
            top: 105px;
        }

        .cup::after {
            content: "";
            position: absolute;
            width: 55px;
            height: 40px;
            border: 10px solid #0879bd;
            border-left: 0;
            border-radius: 0 35px 35px 0;
            right: -65px;
            top: 5px;
        }

        .plate {
            position: absolute;
            width: 175px;
            height: 22px;
            border: 9px solid #0879bd;
            border-radius: 50%;
            left: 32px;
            top: 185px;
        }

        .line1,
        .line2 {
            position: absolute;
            border-radius: 50%;
            border: 8px solid #0879bd;
            border-left-color: transparent;
            border-right-color: transparent;
            border-bottom-color: transparent;
            width: 125px;
            height: 35px;
            left: 58px;
        }

        .line1 {
            top: 145px;
        }

        .line2 {
            top: 165px;
        }

        .steam {
            position: absolute;
            color: #e3232b;
            font-size: 80px;
            font-weight: bold;
            transform: rotate(-20deg);
            left: 83px;
            top: 5px;
        }

        .menu {
            text-align: center;
            font-size: 20px;
            margin-bottom: 35px;
        }

        .menu a {
            color: #42178b;
            text-decoration: underline;
        }

        hr {
            border: 0;
            border-top: 1px solid #999;
            margin-bottom: 45px;
        }

        h1 {
            font-size: 38px;
            font-weight: normal;
            margin-bottom: 70px;
        }

        table {
            border-collapse: collapse;
            width: 310px;
            max-width: 100%;
            background: rgba(255,255,255,.65);
        }

        th,
        td {
            border: 1.5px solid #333;
            padding: 18px 15px;
            text-align: left;
            font-size: 22px;
        }

        th {
            font-weight: normal;
        }

        .catatan {
            font-style: italic;
            font-size: 20px;
            line-height: 1.8;
        }

        footer {
            text-align: center;
            color: #777;
            font-size: 18px;
            margin-top: 65px;
            padding-bottom: 20px;
        }

        @media (max-width: 500px) {
            .container {
                width: 90%;
            }

            .menu {
                font-size: 17px;
            }

            h1 {
                font-size: 30px;
            }

            th,
            td {
                font-size: 19px;
                padding: 15px 12px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="logo">
        <div class="java-logo">
            <div class="steam">〽</div>
            <div class="cup"></div>
            <div class="line1"></div>
            <div class="line2"></div>
            <div class="plate"></div>
        </div>
    </div>

    <div class="menu">
        <a href="index.html">Beranda</a>
        |
        <a href="jadwal.html">Jadwal Operasional</a>
    </div>

    <hr>

    <h1>
        Jam Operasional Kedai
    </h1>

    <table>

        <tr>
            <th>Hari</th>
            <th>Jam Buka</th>
        </tr>

        <tr>
            <td>
                Senin -<br>
                Jumat
            </td>

            <td>
                09.00 -<br>
                22.00
            </td>
        </tr>

        <tr>
            <td>
                Sabtu -<br>
                Minggu
            </td>

            <td>
                10.00 -<br>
                24.00
            </td>
        </tr>

        <tr>
            <td colspan="2" class="catatan">
                Format waktu dalam<br>
                WIB
            </td>
        </tr>

    </table>

    <footer>
        Created by Rahmat Aprianto @2026
    </footer>

</div>

</body>
</html>
